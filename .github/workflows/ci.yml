name: CI

on:
  push:
  pull_request:

jobs:
  php:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: integrar_test
          MYSQL_ROOT_PASSWORD: password
          MYSQL_ROOT_HOST: '%'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -ppassword --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: integrar_test
      DB_USERNAME: root
      DB_PASSWORD: password
      MYSQL_DATABASE: integrar_test
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql, zip, gd, bcmath, soap, curl
          coverage: none
      - name: Instalar dependências PHP
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Preparar .env
        run: |
          cp .env.example .env
          sed -i 's/^DB_CONNECTION=.*/DB_CONNECTION=mysql/' .env
          sed -i 's/^# DB_HOST=.*/DB_HOST=127.0.0.1/' .env
          sed -i 's/^# DB_PORT=.*/DB_PORT=3306/' .env
          sed -i 's/^# DB_DATABASE=.*/DB_DATABASE=integrar_test/' .env
          sed -i 's/^# DB_USERNAME=.*/DB_USERNAME=root/' .env
          sed -i 's/^# DB_PASSWORD=.*/DB_PASSWORD=password/' .env
          sed -i 's/^SESSION_DRIVER=.*/SESSION_DRIVER=array/' .env
          sed -i 's/^QUEUE_CONNECTION=.*/QUEUE_CONNECTION=sync/' .env
          sed -i 's/^CACHE_STORE=.*/CACHE_STORE=array/' .env
          php artisan key:generate --force
      - name: Aguardar MySQL
        run: |
          php -r '
          for ($i = 0; $i < 30; $i++) {
              try {
                  new PDO("mysql:host=127.0.0.1;port=3306", "root", "password");
                  fwrite(STDOUT, "MySQL pronto\n");
                  exit(0);
              } catch (Throwable $e) {
                  sleep(2);
              }
          }
          fwrite(STDERR, "MySQL indisponível\n");
          exit(1);
          '
      - name: Migrar MySQL (testes Tenant)
        run: php artisan migrate --force
      - name: Pint
        continue-on-error: true
        run: vendor/bin/pint --test
      - name: Testes PHP
        run: php artisan test --exclude-filter='Tests\\Feature\\Auth\\|Tests\\Feature\\ProfileTest|Tests\\Feature\\ExampleTest'

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run build

  runner:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scripts/automacao-fiscal/runner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: scripts/automacao-fiscal/runner/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Testes dos scripts de manutenção
        run: |
          cp .env.example .env
          bash tests/scripts/test_preparar_documentos_producao.sh
          bash tests/scripts/test_atualizar_producao.sh
          bash tests/scripts/test_diagnostico_migracao_nativa.sh
          bash tests/scripts/test_verificar_migracao_nativa.sh
          bash tests/scripts/test_habilitar_automacao_fiscal_producao.sh
          bash tests/scripts/test_instalar_deps_automacao_fiscal.sh
          bash tests/scripts/test_instalar_nativo_producao.sh
