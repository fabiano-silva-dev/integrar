# Evolution API — isolada da stack Laravel (app/db do docker-compose.yml).
# Produção nativa: Apache + PHP-FPM + MySQL no host. Este arquivo NÃO sobe a aplicação.
#
#   docker-compose -p integrar-evolution -f docker-compose.evolution.yml up -d
version: '3.8'

services:
  evolution-postgres:
    image: postgres:15
    container_name: integrar-evolution-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: evolution
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      TZ: America/Sao_Paulo
    volumes:
      - evolution_postgres_data:/var/lib/postgresql/data
    networks:
      - evolution-net

  evolution-api:
    image: evoapicloud/evolution-api:v2.3.7
    container_name: integrar-evolution-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:${EVOLUTION_PORT:-8080}:8080"
    env_file:
      - ./docker/evolution.env
    depends_on:
      - evolution-postgres
    volumes:
      - evolution_instances_data:/evolution/instances
    networks:
      - evolution-net

networks:
  evolution-net:
    name: integrar-evolution-net

volumes:
  evolution_postgres_data:
  evolution_instances_data:
